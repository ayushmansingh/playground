name: he-diy-dashboard
description: Day-on-day and agent-level HE DIY funnel performance.

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

# Both sets of commands are written so they work whether they are run from the
# package root or from the component's own folder. The root carries a
# package.json, a requirements.txt and a main.py that delegate into backend/
# and frontend/, so "npm install", "npm run build", "pip install -r
# requirements.txt" and "uvicorn main:app" all resolve correctly either way.

backend:
  language: python
  directory: backend
  install: pip install -r requirements.txt
  start: uvicorn main:app --host 0.0.0.0 --port 8000
  host: 0.0.0.0
  port: 8000
  health_check: /api/health

frontend:
  framework: vite
  directory: frontend
  install: npm install
  build: npm run build
  # Relative to the package root. Inside frontend/ the same folder is "dist".
  output: frontend/dist

# ---------------------------------------------------------------------------
# Settings the app reads from the environment. Values are never in the ZIP.
#
# Nothing here is required, so the app starts as soon as it is uploaded and
# serves the snapshot bundled inside the package. Adding the Redash key later
# switches the Refresh button on; no other setting needs touching.
# ---------------------------------------------------------------------------

settings:
  # SECRET - named, never valued here. Deliberately not required: the
  # dashboard is snapshot-first and fully usable without it, so marking it
  # required would stop the app from starting for no good reason. Until it is
  # set, the Refresh button is disabled and the UI explains why.
  - name: REDASH_API_KEY
    description: >-
      Optional - Redash personal API key, from Profile on common-redash.
      Without it the dashboard still works from the snapshot in the package;
      only the Refresh Redash button is disabled.
    required: false

  # APP'S OWN - values the app decides, each with a default, so nobody is
  # asked for them. Safe to show in full: none of them is a credential.
  - name: REDASH_HOST
    description: Base URL of the Redash instance the Refresh button queries.
    default: https://common-redash.mmt.live

  - name: PAGE_SIZE
    description: >-
      Agent rows returned per request, and the starting value of the Show
      control on the Agent tab. Between 1 and 500.
    default: 100

  - name: REDASH_TIMEOUT_SECONDS
    description: >-
      How long a refresh waits for a Redash query before giving up. Between
      30 and 3600.
    default: 900

  - name: SYNC_ENABLED
    description: >-
      Refresh the data automatically on a timer. Needs a Redash key; without
      one the schedule stays idle whatever this is set to. Set to false to
      leave refreshing to the button.
    default: "true"

  - name: SYNC_INTERVAL_MINUTES
    description: >-
      Minutes between automatic refreshes. Between 5 and 1440. After a failed
      attempt the wait doubles, up to six times this, and resets on success,
      so a broken upstream is not queried every interval forever.
    default: 60

  - name: SYNC_ON_STARTUP
    description: >-
      Also refresh immediately when the app starts. Left off so a redeploy
      does not fire a query every time; the first scheduled run happens one
      interval later.
    default: "false"

  - name: SNAPSHOT_RETENTION
    description: >-
      How many refreshed snapshots to keep in the data directory. Older ones
      are deleted after each successful refresh. Between 2 and 500.
    default: 48

  - name: REDASH_VERIFY_TLS
    description: >-
      Verify the Redash TLS certificate. Leave as true. Set to false only for
      an internal host with a private certificate chain.
    default: "true"
