<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
